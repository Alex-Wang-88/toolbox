<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 生图 - 音视频工具</title>
    <link rel="stylesheet" href="/ui.css">
    <script src="/theme.js"></script>
    <script src="/app_common.js"></script>
    <script src="/workspace.js" defer></script>
    <style>
        /* ==================================================
           本页专属布局：AI 生图
           颜色、字号、按钮、输入框全部来自 ui.css
           ================================================== */

        .top { margin-bottom: var(--sp-7); }

        /* ---------- 资源模式提示 ---------- */
        .mode-card {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            flex-wrap: wrap;
            padding: var(--sp-2) var(--sp-4);
            margin-bottom: var(--sp-4);
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            background: var(--panel);
            color: var(--text-2);
            font-size: var(--fs-12);
        }

        .mode-card.busy {
            border-color: color-mix(in srgb, var(--danger) 26%, transparent);
            background: var(--danger-soft);
            color: var(--danger);
        }

        .mode-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--success); }
        .mode-card.busy .mode-dot { background: var(--danger); }
        .mode-card .detail { margin-left: auto; color: var(--muted); font-size: var(--fs-11); }

        /* ---------- 两栏工作区 ---------- */
        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.02fr);
            gap: var(--sp-7);
            align-items: start;
        }

        .field { margin-bottom: var(--sp-4); }
        .field > label { display: block; margin-bottom: var(--sp-2); color: var(--text-2); font-size: var(--fs-12); font-weight: 600; }
        .field > label .hint { margin-left: var(--sp-1); font-weight: 400; }

        .presets { margin-bottom: var(--sp-2); }

        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
        .grid2 .field { margin-bottom: 0; }

        .field + .grid2 { margin-bottom: var(--sp-4); }

        .actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-2); }
        .actions .primary { flex: 1; }
        .actions .secondary { min-width: 76px; }

        .msg { margin-top: var(--sp-3); }

        /* ---------- 结果区 ---------- */
        .progress-wrap { margin-bottom: var(--sp-4); }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            gap: var(--sp-3);
            margin-bottom: var(--sp-1);
            color: var(--muted);
            font-size: var(--fs-11);
            font-variant-numeric: tabular-nums;
        }

        .result-actions { margin-top: var(--sp-3); }

        .result-actions a {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: var(--h-md);
            min-width: 0;
            padding: 10px var(--sp-5);
            border: 1px solid var(--line);
            border-radius: var(--r-sm);
            background: var(--panel);
            color: var(--text);
            font-size: var(--fs-14);
            line-height: 20px;
            font-weight: 600;
            text-decoration: none;
            transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
        }

        .result-actions a:hover { border-color: var(--line-strong); background: var(--soft); text-decoration: none; }

        .log { margin-top: var(--sp-3); max-height: 132px; }
        .log > div { padding: 1px 0; }

        .history { margin-top: var(--sp-5); }
        .history > .panel-head { padding: 0 0 var(--sp-2); border: 0; }

        @media (max-width: 960px) {
            .workspace { grid-template-columns: 1fr; }
        }

        @media (max-width: 620px) {
            .grid2 { grid-template-columns: 1fr; }
            .stage { min-height: 220px; }
        }
    </style>
</head>
<body>
    <main class="app">
        <nav class="mainnav" aria-label="主导航">
            <a class="nav-brand" href="/">音视频工具</a>
            <div class="nav-links">
                <a class="nav-link" href="/">图片视频生成</a>
                <a class="nav-link" href="/tts">TTS 语音合成</a>
                <a class="nav-link" href="/singing">AI 唱歌</a>
                <a class="nav-link" href="/audio-converter">音频转换</a>
                <a class="nav-link active" href="/imagegen" aria-current="page">AI 生图</a>
            </div>
        </nav>

        <header class="top">
            <h1>AI 生图
                <small>描述画面，选择尺寸，生成本地图片</small>
            </h1>
        </header>

        <div class="mode-card" id="modeCard">
            <span class="mode-dot"></span>
            <span id="modeText">正在检查资源模式...</span>
            <span class="detail" id="modeDetail"></span>
        </div>

        <div class="workspace">
            <section class="panel">
                <div class="panel-head">生成参数</div>
                <div class="panel-body">
                    <div class="field">
                        <label for="prompt">提示词 <span class="hint">要显示的文字请放在双引号里，中英文都支持</span></label>
                        <div class="presets" id="presets"></div>
                        <textarea id="prompt" maxlength="2000" placeholder="例如：一张极简风格海报，米色背景，顶部大字标题写着&quot;山间一盏茶&quot;"></textarea>
                        <div class="hint" style="text-align:right;margin-top:4px"><span id="charCount">0</span>/2000</div>
                    </div>

                    <div class="grid2">
                        <div class="field">
                            <label for="width">宽度</label>
                            <select id="width"><option>512</option><option>768</option><option selected>1024</option></select>
                        </div>
                        <div class="field">
                            <label for="height">高度</label>
                            <select id="height"><option>512</option><option>768</option><option selected>1024</option></select>
                        </div>
                    </div>
<div data-advanced="sampling" data-advanced-title="采样设置" class="grid2">                        <div class="field">
                            <label for="steps">采样步数 <span class="hint">越多越精细，越慢</span></label>
                            <select id="steps"><option value="8">8 步（快速草稿）</option><option value="20">20 步</option><option value="30" selected>30 步（推荐）</option><option value="50">50 步（最佳质量）</option></select>
                        </div>
                        <div class="field">
                            <label for="guidance">CFG <span class="hint">官方推荐 3.0</span></label>
                            <input id="guidance" type="number" min="1" max="8" step="0.5" value="3">
                        </div>
                    <div class="field">
                        <label for="seed">随机种子 <span class="hint">相同种子可复现同一张图</span></label>
                        <input id="seed" type="number" min="0" max="2147483647" value="42">
                    </div>

</div>
                    <div class="actions">
                        <button class="primary" id="generateBtn" type="button">开始生成</button>
                        <button class="secondary" id="cancelBtn" type="button" disabled>取消</button>
                    </div>
                    <div class="msg" id="msg"></div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head">生成结果</div>
                <div class="panel-body">
                    <div class="progress-wrap">
                        <div class="progress-meta"><span id="progressText">等待生成</span><span id="progressPct">0%</span></div>
                        <div class="bar" id="bar"><i id="barFill"></i></div>
                    </div>
                    <div class="stage" id="stage">生成结果会显示在这里<br>首次生成需加载本地模型，约 20–30 秒</div>
                    <div class="result-actions" id="resultActions" style="display:none">
                        <a id="downloadLink" href="#" download>下载图片</a>
                        <a id="openLink" href="#" target="_blank" rel="noopener">查看原图</a>
                    </div>
                    <div class="log" id="log"></div>
                    <div class="history">
                        <div class="panel-head" style="padding:0 0 8px;border:0">最近生成</div>
                        <div class="history-grid" id="historyGrid"><span class="history-empty">暂无记录</span></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
    (function () {
        'use strict';
        const $ = function (id) { return document.getElementById(id); };
        const PRESETS = [
            { label: '中文海报', text: '一张极简风格的中国茶饮海报，米色纸纹背景，中央一只青瓷茶杯冒着热气，顶部大字标题写着"山间一盏茶"，下方小字"清明前 · 手工采摘"，柔和自然光，大面积留白，平面设计风格' },
            { label: '写实人像', text: 'A natural photorealistic portrait of a young woman in soft window light, shallow depth of field, subtle skin texture, muted color palette' },
            { label: '产品静物', text: 'A minimal product photo of a matte black ceramic mug on a pale stone surface, soft morning light, clean composition, high detail' },
            { label: '风景', text: '清晨的湖面，薄雾，远处层叠的青山，一叶小舟，柔和的金色光线，写实摄影风格，宁静氛围' }
        ];
        const TASK_KEY = 'imagegen';
        let taskId = null;
        let timer = null;
        let modeReady = false;
        let activeWatch = null;

        function showMsg(text, kind) {
            const el = $('msg');
            el.textContent = text || '';
            el.className = 'msg show ' + (kind || '');
        }
        function clearMsg() { $('msg').className = 'msg'; }

        function log(text) {
            const el = $('log');
            const line = document.createElement('div');
            line.textContent = '[' + new Date().toLocaleTimeString('zh-CN', { hour12: false }) + '] ' + text;
            el.appendChild(line);
            el.scrollTop = el.scrollHeight;
        }

        function setModeCard(text, detail, busy) {
            $('modeText').textContent = text;
            $('modeDetail').textContent = detail || '';
            $('modeCard').className = 'mode-card' + (busy ? ' busy' : '');
        }

        async function reportMode() {
            modeReady = true;
            setModeCard('任务按顺序执行', '轮到本任务时自动准备资源', false);
            return true;
        }
        async function refreshMode() { return {}; }

        function setProgress(pct, text, indeterminate) {
            $('progressPct').textContent = indeterminate ? '...' : pct + '%';
            $('progressText').textContent = text || '';
            $('barFill').style.width = indeterminate ? '35%' : pct + '%';
            $('bar').className = 'bar' + (indeterminate ? ' indeterminate' : '');
        }

        function setBusy(busy) {
            $('generateBtn').disabled = busy || !modeReady;
            $('cancelBtn').disabled = !busy;
        }

        function renderImage(src) {
            const stage = $('stage');
            stage.innerHTML = '';
            const img = document.createElement('img');
            img.src = src;
            img.alt = 'MOSS-Image 生成结果';
            stage.appendChild(img);
            $('resultActions').style.display = 'flex';
            $('downloadLink').href = '/api/imagegen/file/' + taskId;
            $('openLink').href = src;
        }

        function applyTaskProgress(t) {
            const pct = Number(t.progress || 0);
            setProgress(pct, t.message || t.stage || '处理中', !!t.indeterminate);
            if (t.logs && t.logs.length) {
                const last = t.logs[t.logs.length - 1];
                if (last && last.message && $('log').lastChild && $('log').lastChild.textContent.indexOf(last.message) === -1) {
                    log(last.message);
                }
            }
        }

        function finishImage(t) {
            activeWatch = null;
            clearInterval(timer); timer = null;
            setBusy(false);
            showMsg('生成完成', 'ok');
            renderImage('/api/imagegen/preview/' + encodeURIComponent((t.result || {}).filename || ''));
            log('生成完成，耗时 ' + ((t.result || {}).elapsed || '?') + ' 秒');
            loadHistory();
            TaskResume.clear(TASK_KEY);
        }

        function failImage(t) {
            activeWatch = null;
            clearInterval(timer); timer = null;
            setBusy(false);
            showMsg(t.message || '任务已结束', 'error');
            log(t.message || '任务已结束');
            TaskResume.clear(TASK_KEY);
        }

        // 提交成功后与“切页返回后恢复”共用同一条轮询链路
        function watchTask(id, startedAt) {
            if (activeWatch) { activeWatch(); activeWatch = null; }
            taskId = id;
            setBusy(true);
            activeWatch = TaskResume.watch({
                taskId: id,
                interval: 1200,
                onTask: applyTaskProgress,
                onDone: finishImage,
                onFail: failImage,
                onLost: function (reason) {
                    activeWatch = null;
                    setBusy(false);
                    showMsg(reason || '任务已丢失', 'error');
                    TaskResume.clear(TASK_KEY);
                }
            });
        }

        window.addEventListener('toolbox-new-task', () => {
            if (activeWatch) { activeWatch(); activeWatch = null; }
            TaskResume.clear(TASK_KEY); taskId = null; setBusy(false);
            setProgress(0, '此前任务已保留在队列，可继续提交新任务', false);
        });
        function resumeImage() {
            const session = TaskResume.load(TASK_KEY);
            if (!session || !session.taskId) return;
            if (session.prompt) {
                $('prompt').value = session.prompt;
                $('charCount').textContent = String(session.prompt.length);
            }
            $('stage').textContent = '正在恢复生成任务...';
            watchTask(session.taskId, session.startedAt);
        }

        async function generate() {
            const prompt = $('prompt').value.trim();
            if (!prompt) { showMsg('请先输入提示词', 'error'); return; }
            clearMsg();
            const payload = {
                prompt: prompt,
                width: Number($('width').value), height: Number($('height').value),
                steps: Number($('steps').value), guidance: Number($('guidance').value),
                seed: Number($('seed').value)
            };
            setBusy(true);
            setProgress(0, '正在提交任务...', true);
            $('stage').textContent = '正在生成，首次需加载本地模型...';
            $('resultActions').style.display = 'none';
            $('log').innerHTML = '';
            try {
                const res = await fetch('/api/imagegen/generate', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const body = await res.json();
                if (!res.ok) { throw new Error(body.error || '提交失败'); }
                taskId = body.task_id;
                log('任务已提交: ' + taskId);
                const startedAt = Date.now();
                TaskResume.save(TASK_KEY, { taskId: taskId, startedAt: startedAt, prompt: prompt });
                watchTask(taskId, startedAt);
            } catch (e) {
                setBusy(false);
                showMsg(e.message, 'error');
                setProgress(0, '提交失败', false);
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/imagegen/history');
                const body = await res.json();
                const items = (body.data || []).slice(0, 12);
                const grid = $('historyGrid');
                grid.innerHTML = '';
                if (!items.length) {
                    grid.innerHTML = '<span class="history-empty">暂无记录</span>';
                    return;
                }
                items.forEach(function (item) {
                    const img = document.createElement('img');
                    img.src = '/api/imagegen/preview/' + encodeURIComponent(item.filename);
                    img.alt = item.filename;
                    img.title = item.mtime + ' · ' + Math.round(item.size / 1024) + ' KB';
                    img.addEventListener('click', function () { renderImage(img.src); });
                    grid.appendChild(img);
                });
            } catch (e) { /* 历史是附加功能，失败不阻塞主流程 */ }
        }

        // ---- 初始化 ----
        (function initPresets() {
            const box = $('presets');
            PRESETS.forEach(function (p) {
                const btn = document.createElement('button');
                btn.type = 'button'; btn.className = 'preset'; btn.textContent = p.label;
                btn.addEventListener('click', function () {
                    $('prompt').value = p.text;
                    $('charCount').textContent = String(p.text.length);
                });
                box.appendChild(btn);
            });
        }());

        $('prompt').addEventListener('input', function () {
            $('charCount').textContent = String(this.value.length);
        });
        $('generateBtn').addEventListener('click', generate);
        $('cancelBtn').addEventListener('click', async function () {
            if (!taskId) { return; }
            try { await fetch('/api/cancel/' + taskId, { method: 'POST' }); log('已请求取消'); } catch (e) {}
        });
        // 模式切换完全由目标页面加载时上报完成，不依赖 beforeunload（不可靠）。
        (async function boot() {
            const ok = await reportMode('imagegen', false);
            setBusy(false);
            if (ok) { await refreshMode(); }
            loadHistory();
            resumeImage();
        }());
    }());
    </script>
</body>
</html>
