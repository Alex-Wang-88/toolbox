<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS 音频生成 - 音视频工具</title>
    <link rel="stylesheet" href="/ui.css">
    <script src="/theme.js"></script>
    <script src="/app_common.js"></script>
    <script src="/workspace.js" defer></script>
    <style>
        /* ==================================================
           本页专属布局：TTS 语音合成
           颜色、字号、按钮、输入框全部来自 ui.css
           ================================================== */


        .top { margin-bottom: var(--sp-7); }

        /* 音色：桌面双列，移动端单列 */
        .voice-list {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: var(--sp-2);
        }

        .voice-list .voice-group { align-self: start; }
        .voice-list .voice-group + .voice-group { margin-top: 0; }

        .voice-list > .hint,
        .voice-list > .voice-create { grid-column: 1 / -1; }

        /* 字数与快捷键提示 */
        .char-count {
            margin-top: var(--sp-1);
            color: var(--faint);
            font-size: var(--fs-11);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .keyboard-hint { margin-top: var(--sp-2); color: var(--faint); font-size: var(--fs-11); }

        .keyboard-hint kbd {
            display: inline-block;
            padding: 1px var(--sp-2);
            border: 1px solid var(--line);
            border-bottom-width: 2px;
            border-radius: var(--r-xs);
            background: var(--soft);
            color: var(--text-2);
            font-family: var(--font-mono);
            font-size: var(--fs-11);
            line-height: 1.5;
        }

        /* 操作区 */
        .row-actions { justify-content: flex-end; }
        .row-actions .primary { min-width: 148px; }

        /* 结果区 */
        .result-area .field-label { margin-bottom: var(--sp-2); }
        .result-area audio { margin-top: var(--sp-2); }

        @media (max-width: 760px) {
            .voice-list { grid-template-columns: 1fr; }
            .voice-list .voice-group + .voice-group { margin-top: var(--sp-2); }
            .row-actions { display: grid; grid-template-columns: 1fr 1fr; }
            .row-actions .primary { min-width: 0; }
            .result-actions > * { flex: 1 1 0; }
        }
    </style>
</head>
<body>
    <main class="app">
        <nav class="mainnav" aria-label="主导航">
            <a class="nav-brand" href="/">音视频工具</a>
            <div class="nav-links"><!-- 由 workspace.js 按 NAV 配置统一渲染 --></div>
        </nav>
        <header class="top">
            <h1>
                TTS 音频生成
                <small>选择音色 · 输入文字 · 一键生成音频</small>
            </h1>
        </header>

        <!-- 音色选择 -->
        <section class="panel">
            <div class="panel-head">
                <div class="panel-title">选择音色</div>
                <div class="count" id="voiceCount">加载中...</div>
            </div>
            <div class="panel-body">
                <div class="voice-list" id="voiceList">
                    <div class="hint">正在加载音色列表...</div>
                </div>
                <div class="voice-error" id="voiceError"></div>
                <div class="hint" id="voiceHint">
                    选择云端音色或已创建的本地音色，就绪后可用。
                </div>
                <div id="voiceCreateMount"></div><!-- 克隆音色表单由 voice_clone_form.js 渲染（与素材转视频页共用） -->
            </div>
        </section>

        <!-- 文本输入 + 生成 -->
        <section class="panel">
            <div class="panel-head">
                <div class="panel-title">输入文字生成音频</div>
                <div class="count" id="selectedVoiceLabel">默认云端</div>
            </div>
            <div class="panel-body">
                <div class="block">
                    <label class="field-label" for="textInput">文本内容</label>
                    <textarea class="text-input" id="textInput" rows="5" placeholder="输入要合成语音的文字内容..."></textarea>
                    <div class="char-count"><span id="charCount">0</span> 字</div>
                    <div class="keyboard-hint">
                        提示：按 <kbd>Ctrl</kbd> + <kbd>Enter</kbd> 可直接生成
                    </div>
                </div>

<div data-advanced="audio" data-advanced-title="语速与音量">                <div class="block">
                    <label class="field-label">语速</label>
                    <div class="speed-row">
                        <input type="range" id="speedRange" min="0.70" max="1.50" step="0.05" value="1.00">
                        <span class="speed-value" id="speedValue">1.00×</span>
                    </div>
                    <div class="hint">范围 0.70× ~ 1.50×，默认 1.00×（原速）</div>
                </div>

                <div class="block">
                    <label class="field-label">配音音量</label>
                    <div class="speed-row">
                        <input type="range" id="voiceVolumeRange" min="0" max="200" step="5" value="100">
                        <span class="speed-value" id="voiceVolumeValue">100%</span>
                    </div>
                    <div class="hint">范围 0% ~ 200%，默认 100%；增强音量时会自动限幅。</div>
                </div>

</div>
                <div class="row-actions">
                    <button class="primary" id="generateBtn" type="button">生成音频</button>
                    <button class="secondary" id="clearBtn" type="button">清空</button>
                </div>

                <!-- 进度卡片 -->
                <div class="progress-card" id="progressCard">
                    <div class="wait-line">
                        <span class="spinner" id="spinner"></span>
                        <div>
                            <div class="wait-title" id="waitTitle">生成中</div>
                            <div class="wait-sub" id="waitSub">已用时 0 秒</div>
                        </div>
                    </div>
                    <div class="bar"><div class="fill" id="progressFill"></div></div>
                    <div class="progress-text" id="progressText">准备中...</div>
                </div>

                <!-- 错误提示 -->
                <div class="error-box" id="errorBox"></div>

                <!-- 成功提示 -->
                <div class="success-box" id="successBox"></div>

                <!-- 结果区 -->
                <div class="result-area" id="resultArea">
                    <div class="field-label">生成结果</div>
                    <audio id="audioPlayer" controls></audio>
                    <div class="result-actions">
                        <a class="dl-btn" id="downloadBtn" download>下载音频</a>
                        <button class="dl-btn secondary" id="reuseBtn" type="button">重新生成</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 历史记录 -->
        <section data-advanced="history" data-advanced-title="配音记录" class="panel">
            <div class="panel-head">
                <div class="panel-title">本次会话历史</div>
                <div class="count" id="historyCount">0 条</div>
            </div>
            <div class="panel-body">
                <div id="historyList">
                    <div class="hint">本次会话生成的音频将显示在这里。</div>
                </div>
            </div>
        </section>
    </main>

    <script src="/voice_clip_editor.js"></script>
    <script src="/voice_clone_form.js"></script>
    <script>
        (function () {
            'use strict';

            const API_BASE = '/api';
            const $ = (id) => document.getElementById(id);

            const state = {
                voices: [],
                selectedVoiceId: 'default',
                voiceGroupExpanded: { edge: false, clone: false },
                generating: false,
                history: [],
            };

            // ===== DOM refs =====
            const voiceList = $('voiceList');
            const voiceCount = $('voiceCount');
            const voiceError = $('voiceError');
            const selectedVoiceLabel = $('selectedVoiceLabel');
            const textInput = $('textInput');
            const charCount = $('charCount');
            const speedRange = $('speedRange');
            const speedValue = $('speedValue');
            const voiceVolumeRange = $('voiceVolumeRange');
            const voiceVolumeValue = $('voiceVolumeValue');
            const generateBtn = $('generateBtn');
            const clearBtn = $('clearBtn');
            const progressCard = $('progressCard');
            const spinner = $('spinner');
            const waitTitle = $('waitTitle');
            const waitSub = $('waitSub');
            const progressFill = $('progressFill');
            const progressText = $('progressText');
            const errorBox = $('errorBox');
            const successBox = $('successBox');
            const resultArea = $('resultArea');
            const audioPlayer = $('audioPlayer');
            const downloadBtn = $('downloadBtn');
            const reuseBtn = $('reuseBtn');
            const historyList = $('historyList');
            const historyCount = $('historyCount');
            const TTS_VOICE_VOLUME_KEY = 'toolbox_tts_voice_volume';

            // ===== Utils =====
            function escapeHtml(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function formatTime(seconds) {
                if (seconds < 60) return `${seconds} 秒`;
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m} 分 ${s} 秒`;
            }

            function showError(msg) {
                errorBox.textContent = msg;
                errorBox.classList.add('active');
                successBox.classList.remove('active');
            }

            function clearError() {
                errorBox.classList.remove('active');
                errorBox.textContent = '';
            }

            function showSuccess(msg) {
                successBox.textContent = msg;
                successBox.classList.add('active');
                setTimeout(() => successBox.classList.remove('active'), 4000);
            }

            async function safeReadJson(res) {
                try { return await res.json(); }
                catch (e) { return {}; }
            }

            // ===== Voice list =====
            async function loadVoices() {
                try {
                    const res = await fetch(`${API_BASE}/voices`);
                    const data = await safeReadJson(res);
                    if (!res.ok) throw new Error(data.error || '读取音色列表失败');
                    state.voices = data.voices || [];
                    state.cloneEngine = data.clone_engine || state.cloneEngine || 'gptsovits';
                    renderVoices();
                } catch (err) {
                    voiceList.innerHTML = `<div class="hint" style="color:var(--danger)">加载失败：${escapeHtml(err.message)}</div>`;
                    voiceCount.textContent = '加载失败';
                }
            }

            function renderVoices() {
                const voices = state.voices;
                voiceCount.textContent = `${voices.length} 个音色`;
                if (!voices.length) {
                    voiceList.innerHTML = '<div class="hint">暂无可用音色</div>';
                    return;
                }
                const edgeVoices = voices.filter((v) =>
                    v.group === 'edge' || (v.type === 'cloud_parallel' && v.group !== 'cosyvoice3')
                );
                const cloneVoices = voices.filter((v) =>
                    v.group === 'cosyvoice3' || v.type === 'cosyvoice3'
                );
                const edgeFemale = edgeVoices.filter((v) => v.gender === 'female');
                const edgeMale = edgeVoices.filter((v) => v.gender === 'male');
                const edgeChild = edgeVoices.filter((v) => v.gender === 'child');
                const edgeOther = edgeVoices.filter((v) =>
                    !v.gender || !['female', 'male', 'child'].includes(v.gender)
                );

                function renderItem(v) {
                    const selected = v.id === state.selectedVoiceId ? ' selected' : '';
                    const unavailable = v.available === false ? ' unavailable' : '';
                    const cloneEngineName = state.cloneEngine === 'gptsovits' ? 'GPT-SoVITS V5' : 'CosyVoice3';
                    const typeLabel = v.type === 'cosyvoice3' ? `${cloneEngineName} 零样本` : 'Edge TTS 云端';
                   const languageLabel = v.type === 'cosyvoice3'
                       ? (v.language_label || '语言未标记')
                       : '';
                    const statusLabel = v.available === false
                        ? (v.availability_reason || '当前不可用')
                        : (v.type === 'cosyvoice3' ? `${typeLabel} · ${languageLabel}` : typeLabel);
                    const actionParts = [];
                    if (v.deletable) {
                        actionParts.push(`<button type="button" data-action="rename" title="重命名">重命名</button>`);
                        actionParts.push(`<button type="button" data-action="download" title="导出参考音频">导出</button>`);
                        actionParts.push(`<button type="button" class="del" data-action="delete" title="删除">删除</button>`);
                    }
                    const actions = actionParts.length ? `<div class="voice-actions">${actionParts.join('')}</div>` : '';
                    return `
                        <div class="voice-item${selected}${unavailable}" data-id="${escapeHtml(v.id)}">
                            <span class="voice-dot"></span>
                            <div class="voice-main">
                                <span class="voice-name">${escapeHtml(v.name)}</span>
                                <span class="voice-tag">${escapeHtml(statusLabel)}</span>
                            </div>
                            ${actions}
                        </div>
                    `;
                }

                function renderEdgeSubgroup(label, items) {
                    if (!items.length) return '';
                    return `
                        <div class="voice-subgroup">
                            <div class="voice-subgroup-title">${escapeHtml(label)}</div>
                            ${items.map(renderItem).join('')}
                        </div>`;
                }

                const edgeHtml = !edgeVoices.length ? '' : `
                    <details class="voice-group edge-group"${state.voiceGroupExpanded.edge ? ' open' : ''}>
                        <summary class="voice-group-summary">
                            <span class="voice-group-arrow">▶</span>
                            <span class="voice-group-title">Edge TTS 云端音色</span>
                            <span class="voice-group-count">${edgeVoices.length}</span>
                        </summary>
                        <div class="voice-group-body">
                            ${renderEdgeSubgroup('女声', edgeFemale)}
                            ${renderEdgeSubgroup('男声', edgeMale)}
                            ${renderEdgeSubgroup('童声', edgeChild)}
                            ${renderEdgeSubgroup('其他', edgeOther)}
                        </div>
                    </details>`;

                const cloneHtml = !cloneVoices.length ? '' : `
                    <details class="voice-group clone-group"${state.voiceGroupExpanded.clone ? ' open' : ''}>
                        <summary class="voice-group-summary">
                            <span class="voice-group-arrow">▶</span>
                            <span class="voice-group-title">${escapeHtml(state.cloneEngine === 'gptsovits' ? 'GPT-SoVITS V5 本地克隆' : 'CosyVoice3 本地克隆')}</span>
                            <span class="voice-group-count">${cloneVoices.length}</span>
                        </summary>
                        <div class="voice-group-body">
                            ${cloneVoices.map(renderItem).join('')}
                        </div>
                    </details>`;

                voiceList.innerHTML = edgeHtml + cloneHtml;
                updateSelectedLabel();
            }

            function updateSelectedLabel() {
                const v = state.voices.find((x) => x.id === state.selectedVoiceId);
                selectedVoiceLabel.textContent = v ? v.name : '默认云端';
            }

            voiceList.addEventListener('click', (event) => {
                const groupSummary = event.target.closest('.voice-group-summary');
                if (groupSummary) {
                    const group = groupSummary.closest('.voice-group');
                    if (group) {
                        const key = group.classList.contains('edge-group') ? 'edge' : 'clone';
                        state.voiceGroupExpanded[key] = !group.open;
                    }
                    return;
                }
                // 先判断是否点中操作按钮（重命名 / 导出 / 删除），点操作按钮时不触发选中
                const actionBtn = event.target.closest('[data-action]');
                if (actionBtn) {
                    const item = actionBtn.closest('.voice-item');
                    if (!item) return;
                    const id = item.dataset.id;
                    const action = actionBtn.dataset.action;
                    if (action === 'rename') { handleRename(id); return; }
                    if (action === 'delete') { handleDelete(id); return; }
                    if (action === 'download') { downloadVoice(id); return; }
                    return;
                }
                const item = event.target.closest('.voice-item');
                if (!item) return;
                const id = item.dataset.id;
                const voice = state.voices.find((v) => v.id === id);
                if (!voice) return;
                if (voice.available === false) {
                    voiceError.textContent = voice.availability_reason || '该音色当前不可用';
                    return;
                }
                voiceError.textContent = '';
                state.selectedVoiceId = id;
                renderVoices();
            });

            // ===== 克隆音色操作：重命名 / 删除 / 导出 =====
            async function handleRename(id) {
                const voice = state.voices.find((v) => v.id === id);
                if (!voice) return;
                const name = window.prompt('重命名音色：', voice.name);
                if (name === null) return;
                const trimmed = name.trim();
                if (!trimmed) return;
                try {
                    const res = await fetch(`${API_BASE}/voices/${encodeURIComponent(id)}/rename`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: trimmed }),
                    });
                    const data = await safeReadJson(res);
                    if (!res.ok) throw new Error(data.error || '重命名失败');
                    showSuccess(`已重命名音色为「${trimmed}」`);
                    await loadVoices();
                } catch (err) {
                    showError(err.message || '重命名失败');
                }
            }

            async function handleDelete(id) {
                if (!window.confirm('确定删除该克隆音色？此操作不可恢复。')) return;
                try {
                    const res = await fetch(`${API_BASE}/voices/${encodeURIComponent(id)}`, { method: 'DELETE' });
                    const data = await safeReadJson(res);
                    if (!res.ok) throw new Error(data.error || '删除失败');
                    if (state.selectedVoiceId === id) {
                        state.selectedVoiceId = 'default';
                        updateSelectedLabel();
                    }
                    showSuccess('已删除克隆音色');
                    await loadVoices();
                } catch (err) {
                    showError(err.message || '删除失败');
                }
            }

            async function downloadVoice(id) {
                try {
                    const res = await fetch(`${API_BASE}/voices/${encodeURIComponent(id)}/download`);
                    if (!res.ok) throw new Error('导出失败');
                    const blob = await res.blob();
                    const voice = state.voices.find((v) => v.id === id);
                    const fname = `${(voice ? voice.name : id).replace(/[\\/:*?"<>|]/g, '_')}.wav`;
                    const objUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = objUrl;
                    a.download = fname;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(objUrl), 1000);
                    showSuccess('已导出克隆参考音频');
                } catch (err) {
                    showError(err.message || '导出失败');
                }
            }

            // ===== Create cloned voice（表单已抽为共享模块 voice_clone_form.js，与素材转视频页共用） =====
            VoiceCloneForm.mount(document.getElementById('voiceCreateMount'), {
                summary: '添加克隆音色',
                dropHint: '建议使用自然说话录音',
                namePlaceholder: '例如：讲解员小林',
                consentText: '我确认已获得该声音的使用授权，并同意仅在本机处理。',
                submitLabel: '创建并选择该音色',
                apiBase: API_BASE,
                fetcher: (path, options) => fetch(`${API_BASE}${path}`, options),
                onCreated: async ({ name, voiceId }) => {
                    state.selectedVoiceId = voiceId;
                    await loadVoices();
                    showSuccess(`已添加克隆音色「${name}」`);
                },
            });

            // ===== Text input =====
            textInput.addEventListener('input', () => {
                const len = (textInput.value || '').length;
                charCount.textContent = len;
            });

            textInput.addEventListener('keydown', (event) => {
                if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
                    event.preventDefault();
                    generateBtn.click();
                }
            });

            // ===== Speed =====
            speedRange.addEventListener('input', () => {
                speedValue.textContent = `${parseFloat(speedRange.value).toFixed(2)}×`;
            });

            function getVoiceVolume() {
                const percent = parseFloat(voiceVolumeRange.value);
                return Math.max(0, Math.min(2, (Number.isFinite(percent) ? percent : 100) / 100));
            }

            function setVoiceVolume(value) {
                const normalized = Math.max(0, Math.min(2, Number(value) || 0));
                const percent = Math.round(normalized * 100 / 5) * 5;
                voiceVolumeRange.value = String(percent);
                voiceVolumeValue.textContent = `${percent}%`;
            }

            voiceVolumeRange.addEventListener('input', () => {
                const value = getVoiceVolume();
                setVoiceVolume(value);
                try { localStorage.setItem(TTS_VOICE_VOLUME_KEY, String(value)); } catch (e) {}
            });

            // ===== Clear =====
            clearBtn.addEventListener('click', () => {
                textInput.value = '';
                charCount.textContent = '0';
                clearError();
                resultArea.classList.remove('active');
                progressCard.classList.remove('active');
                textInput.focus();
            });

            // ===== Generate =====
            const TASK_KEY = 'tts';
            let startTime = 0;
            let elapsedTimer = null;
            let activeWatch = null;

            function startProgress(title, startedAt) {
                progressCard.classList.add('active');
                progressCard.classList.remove('indeterminate');
                spinner.classList.add('active');
                waitTitle.textContent = title;
                progressFill.style.width = '10%';
                startTime = Number(startedAt) || Date.now();
                waitSub.textContent = `已用时 ${formatTime((Date.now() - startTime) / 1000)}`;
                if (elapsedTimer) clearInterval(elapsedTimer);
                elapsedTimer = setInterval(() => {
                    const elapsed = Math.round((Date.now() - startTime) / 1000);
                    waitSub.textContent = `已用时 ${formatTime(elapsed)}`;
                }, 500);
            }

            function stopProgress() {
                if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
                spinner.classList.remove('active');
            }

            function failProgress(msg) {
                stopProgress();
                progressCard.classList.remove('indeterminate');
                progressCard.classList.remove('active');
                showError(msg);
            }

            function applyTaskProgress(task) {
                const progress = Math.max(0, Math.min(100, Number(task.progress) || 0));
                progressFill.style.width = `${progress}%`;
                progressCard.classList.toggle('indeterminate', Boolean(task.indeterminate));
                progressText.textContent = `${Math.round(progress)}% · ${task.message || '处理中...'}`;
                const stageTitles = {
                    queued: '等待开始', prepare: '准备语音引擎', tts: '正在分段生成配音',
                    finalize: '正在整理音频', video: '正在生成视频', completed: '生成完成'
                };
                waitTitle.textContent = stageTitles[task.stage] || '生成音频中';
            }

            function renderTtsResult(data, meta) {
                const info = meta || {};
                const base = window.location.origin;
                const audioUrl = base + data.audio_url;
                audioPlayer.src = audioUrl;
                downloadBtn.href = audioUrl;
                downloadBtn.download = `tts_${Date.now()}.mp3`;
                resultArea.classList.add('active');

                const voice = state.voices.find((v) => v.id === (info.voiceId || state.selectedVoiceId));
                const voiceName = info.voiceName || (voice ? voice.name : '默认云端');
                const text = info.text || textInput.value || '';
                showSuccess(`音频生成成功（${voiceName} · ${text.length} 字）`);
                addHistory({
                    text,
                    voice: voiceName,
                    audioUrl,
                    speed: info.speed == null ? parseFloat(speedRange.value) : info.speed,
                    volume: info.volume == null ? getVoiceVolume() : info.volume,
                    time: new Date().toLocaleTimeString('zh-CN', { hour12: false }),
                });
            }

            function finishTts(data, meta) {
                progressFill.style.width = '100%';
                progressText.textContent = '生成完成';
                stopProgress();
                progressCard.classList.remove('active', 'indeterminate');
                renderTtsResult(data || {}, meta || {});
                TaskResume.clear(TASK_KEY);
                state.generating = false;
                generateBtn.disabled = false;
            }

            function failTts(message) {
                failProgress(message || '生成失败');
                TaskResume.clear(TASK_KEY);
                state.generating = false;
                generateBtn.disabled = false;
            }

            // 提交成功后与“切页返回后恢复”共用同一条轮询链路
            window.addEventListener('toolbox-new-task', () => {
                if (activeWatch) { activeWatch(); activeWatch = null; }
                TaskResume.clear(TASK_KEY); state.generating = false;
                stopProgress(); progressCard.classList.remove('active', 'indeterminate');
                generateBtn.disabled = false;
                showSuccess('此前任务继续在队列中执行，完成后可到任务队列下载。');
            });
            function watchTask(taskId, startedAt, meta) {
                if (activeWatch) { activeWatch(); activeWatch = null; }
                state.generating = true;
                generateBtn.disabled = true;
                startProgress('生成音频中', startedAt);
                activeWatch = TaskResume.watch({
                    taskId,
                    interval: 900,
                    onTask: applyTaskProgress,
                    onDone: (task) => { activeWatch = null; finishTts(task.result || {}, meta); },
                    onFail: (task) => { activeWatch = null; failTts(task.message || '生成失败'); },
                    onLost: (reason) => { activeWatch = null; failTts(`${reason || '任务已丢失'}，请重新提交`); }
                });
            }

            function resumeTts() {
                const session = TaskResume.load(TASK_KEY);
                if (!session || !session.taskId) return;
                if (session.text) {
                    textInput.value = session.text;
                    charCount.textContent = String(session.text.length);
                }
                if (session.speed != null) {
                    speedRange.value = String(session.speed);
                    speedValue.textContent = `${Number(session.speed).toFixed(2)}×`;
                }
                if (session.volume != null) setVoiceVolume(session.volume);
                watchTask(session.taskId, session.startedAt, {
                    text: session.text, voiceId: session.voiceId, voiceName: session.voiceName,
                    speed: session.speed, volume: session.volume
                });
            }

            generateBtn.addEventListener('click', async () => {
                const text = (textInput.value || '').trim();
                if (!text) {
                    showError('请先输入要合成的文字内容');
                    textInput.focus();
                    return;
                }
                if (state.generating) return;

                state.generating = true;
                generateBtn.disabled = true;
                clearError();
                resultArea.classList.remove('active');

                const meta = {
                    text,
                    voiceId: state.selectedVoiceId,
                    voiceName: (state.voices.find((v) => v.id === state.selectedVoiceId) || {}).name || '默认云端',
                    speed: parseFloat(speedRange.value),
                    volume: getVoiceVolume(),
                };
                startProgress('生成音频中');

                try {
                    const res = await fetch(`${API_BASE}/tts/quick`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text,
                            voice: state.selectedVoiceId,
                            speed: parseFloat(speedRange.value),
                            voice_volume: getVoiceVolume(),
                            with_video: false,
                            image: null,
                            async: true,
                        }),
                    });
                    const submitted = await safeReadJson(res);
                    if (!res.ok) throw new Error(submitted.error || '生成失败');
                    if (!submitted.task_id) { finishTts(submitted, meta); return; }
                    const startedAt = Date.now();
                    TaskResume.save(TASK_KEY, Object.assign({ taskId: submitted.task_id, startedAt }, meta));
                    watchTask(submitted.task_id, startedAt, meta);
                } catch (err) {
                    failTts(err.message || '生成失败');
                }
            });

            reuseBtn.addEventListener('click', () => {
                resultArea.classList.remove('active');
                textInput.focus();
            });

            // ===== History =====
            function addHistory(item) {
                state.history.unshift(item);
                if (state.history.length > 20) state.history.pop();
                renderHistory();
            }

            function renderHistory() {
                historyCount.textContent = `${state.history.length} 条`;
                if (!state.history.length) {
                    historyList.innerHTML = '<div class="hint">本次会话生成的音频将显示在这里。</div>';
                    return;
                }
                historyList.innerHTML = state.history.map((h, idx) => `
                    <div style="padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--soft);">
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;">
                            <span style="font-size:12px;color:var(--muted);font-weight:700;">#${idx + 1} · ${escapeHtml(h.voice)} · ${escapeHtml(h.time)}</span>
                            <span style="font-size:11px;color:var(--muted);">${h.speed.toFixed(2)}× · ${Math.round((h.volume ?? 1) * 100)}%</span>
                        </div>
                        <div style="font-size:13px;margin-bottom:6px;word-break:break-all;">${escapeHtml(h.text.length > 100 ? h.text.slice(0, 100) + '...' : h.text)}</div>
                        <audio controls preload="none" src="${escapeHtml(h.audioUrl)}" style="width:100%;"></audio>
                    </div>
                `).join('');
            }

            // ===== Init =====
            try {
                const savedVolume = parseFloat(localStorage.getItem(TTS_VOICE_VOLUME_KEY));
                setVoiceVolume(Number.isFinite(savedVolume) ? savedVolume : 1);
            } catch (e) {
                setVoiceVolume(1);
            }
            loadVoices();
            resumeTts();
            textInput.focus();
        })();
    </script>



</body>
</html>
